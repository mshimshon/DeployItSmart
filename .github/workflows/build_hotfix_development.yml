name: Auto-PR Hotfix to Development

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  create-and-merge-dev-pr:
    if: |
      github.event.pull_request.merged == true && github.event.pull_request.head.ref != 'main-dev'

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create and Auto-Merge PR into main.dev
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Creating a new PR targeting 'main.dev'..."

          # 1. Create the PR and capture the URL
          PR_URL=$(gh pr create \
            --base main.dev \
            --head "$SOURCE_BRANCH" \
            --title "Sync: $PR_TITLE (from PR #$PR_NUMBER)" \
            --body "This PR was automatically created to sync '$SOURCE_BRANCH' into main.dev. Attempting auto-merge...")

          echo "PR created successfully: $PR_URL"

          # 2. Attempt to merge immediately. Branch is kept alive.
          echo "Attempting to merge PR..."
          if gh pr merge "$PR_URL" --merge --auto; then
            echo "✅ PR successfully merged (or queued for auto-merge). Branch '$SOURCE_BRANCH' was kept alive."
          else
            echo "⚠️ Auto-merge failed. The PR remains open and branch '$SOURCE_BRANCH' is active for manual conflict resolution."
          fi
