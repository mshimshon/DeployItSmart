name: Release
on:
  workflow_run:
    workflows: ["Build"] # 👈 Put the EXACT name of your build workflow here
    types:
      - completed
  workflow_dispatch: # Keeps your manual trigger working

concurrency:
  group: deploy-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      actions: write
      contents: write

    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 👈 This forces GitHub to pull ALL history and tags

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Building DeployItSmart ;)
        run: bash -e .github/workflows/composition/build_deployitsmart_tool.sh


      - name: Get Last Version Tag
        id: version_control
        shell: bash
        run: |
          dotnet run --project /tmp/deploy_scripting/src/DeployItSmart.csproj --no-build --configuration Release -- GetCurrentReleaseVersionRunner --ghOutput
          dotnet run --project /tmp/deploy_scripting/src/DeployItSmart.csproj --no-build --configuration Release -- CalculateNextReleaseVersionRunner --ghOutput

      - name: Building Shipping Release DeployItSmart ;)
        run: bash -e .github/workflows/composition/publish_deployitsmart_final.sh
        env:
          VERSION_NEXT: ${{ steps.version_control.outputs.version_next }}

      - name: Generate Release Notes
        shell: bash
        run: dotnet run --project /tmp/deploy_scripting/src/DeployItSmart.csproj --no-build --configuration Release -- GenerateChangeLogRunner --output "/tmp/artifacts/output"  --linkCommits

      - name: Validating Output
        shell: bash
        run: bash -e .github/workflows/composition/validate_release_outputs.sh
        env:
          VERSION_NEXT: ${{ steps.version_control.outputs.version_next }}


      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_control.outputs.version_next }}
          body_path: "/tmp/artifacts/output/_.${{ steps.version_control.outputs.version_next }}.md"
          fail_on_unmatched_files: true
          files: |
            /tmp/artifacts/output/deployitsmart_win_x64.tar.gz
            /tmp/artifacts/output/deployitsmart_linux_x64.tar.gz
            /tmp/artifacts/output/DeployItSmart.${{ steps.version_control.outputs.version_next }}.nupkg
            /tmp/artifacts/output/_.${{ steps.version_control.outputs.version_next }}.md

      - name: Push all NuGet packages with retry
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 30
          max_attempts: 10
          retry_wait_seconds: 10
          command: |
            set -eu
            VERSION="${{ steps.version_control.outputs.version_next }}"

            for PKG in /tmp/artifacts/output/*.nupkg; do
              echo "Pushing $PKG"

              dotnet nuget push \
                "$PKG" \
                --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
                --source https://api.nuget.org/v3/index.json \
                --skip-duplicate || exit 1
            done
